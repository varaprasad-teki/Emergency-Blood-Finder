<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeLink AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<div class="logo">🩸 LifeLink AI</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Donate</a></li>
<li><a href="#">Find Blood</a></li>
<li><a href="#">Emergency</a></li>
</ul>

</nav>

<section class="hero">

<h1>Save Lives Instantly</h1>

<p>
Smart Blood Donation &
Emergency Response Platform
</p>

<button>Donate Now</button>

</section>

<section class="stats">

<div class="card">
<h2>12000+</h2>
<p>Donors</p>
</div>

<div class="card">
<h2>8500+</h2>
<p>Lives Saved</p>
</div>

<div class="card">
<h2>500+</h2>
<p>Blood Requests</p>
</div>

<div class="card">
<h2>50+</h2>
<p>Hospitals</p>
</div>

</section>

<section class="register">

<h2>Donor Registration</h2>

<form id="registerForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="number" id="age" placeholder="Age" required>

<select id="bloodGroup">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>

</select>

<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="location" placeholder="Location">

<button type="submit">
Register
</button>

</form>

</section>

<section class="search">

<h2>Find Blood Donor</h2>

<select id="searchBlood">

<option>O+</option>
<option>O-</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>

</select>

<input
type="text"
id="searchLocation"
placeholder="Enter Location">

<button onclick="findDonor()">
Search
</button>

<div id="result"></div>

</section>

<script src="script.js"></script>

</body>
</html>
